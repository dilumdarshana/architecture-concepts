services:
  # PostgreSQL — stores orders, outbox events, and processed-message
  # idempotency records. Mapped to port 5433 to avoid conflicts with
  # a local Postgres instance on the default port.
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: express_resilience
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d express_resilience"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis — BullMQ backend for the job queue. Mapped to port 6380
  # to avoid conflicts with a local Redis on the default port.
  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
